name: Transitive pins

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: transitive-pins
  cancel-in-progress: false

jobs:
  pin-transitives:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout renovate-config
        uses: actions/checkout@v7
        with:
          repository: lightwell-experience/renovate-config
          ref: main
          path: .renovate-config
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .renovate-config/package-lock.json

      - name: Install Renovate
        working-directory: .renovate-config
        run: npm ci

      - name: Pin transitive dependencies
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/pin-transitives.log"
          echo "Running pin-transitives"
          # Renovate lowercases RENOVATE_LOG_FILE. A relative name stays in the temp directory.
          renovate="${GITHUB_WORKSPACE}/.renovate-config/node_modules/.bin/renovate"
          set +e
          node .renovate-config/scripts/pin-transitives.mjs --write \
            --renovate "env RENOVATE_LOG_FILE=renovate.ndjson ${renovate} --platform=local --onboarding=false --dry-run=lookup" \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          tmp=$(sed -n 's/^Temporary files (not deleted): //p' "$log" | tail -1)
          echo "pin-transitives temp: ${tmp:-not found}"
          renovate_log=""
          if [ -n "${tmp}" ] && [ -f "${tmp}/renovate.ndjson" ]; then
            renovate_log="${tmp}/renovate.ndjson"
          else
            lower=$(printf '%s' "${tmp}" | tr '[:upper:]' '[:lower:]')
            if [ -n "${lower}" ] && [ -f "${lower}/renovate.ndjson" ]; then
              renovate_log="${lower}/renovate.ndjson"
              echo "Renovate log was written to the lowercased path: ${renovate_log}"
            fi
          fi

          echo "::group::Resolved dependencies"
          if [ -n "${tmp}" ] && [ -f "${tmp}/dependency-tree.json" ]; then
            python3 - "${tmp}/dependency-tree.json" << 'PY'
          import json, sys
          raw = open(sys.argv[1], encoding="utf-8").read()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print("dependency-tree.json is not JSON. First lines:")
              print("\n".join(raw.splitlines()[:40]))
              sys.exit(0)
          seen = set()
          def walk(node, depth):
              if depth and node.get("groupId") and node.get("artifactId") and node.get("scope") != "test":
                  name = f"{node['groupId']}:{node['artifactId']}"
                  if name not in seen:
                      seen.add(name)
                      kind = "direct" if depth == 1 else "transitive"
                      print(f"{name}:{node.get('version', '')}  {kind}")
              for child in node.get("children") or []:
                  walk(child, depth + 1)
          for node in data if isinstance(data, list) else [data]:
              walk(node, 0)
          if not seen:
              print("none")
          PY
          else
            echo "Maven dependency tree was not found."
          fi
          echo "::endgroup::"

          echo "::group::Renovate log"
          if [ -n "${renovate_log}" ]; then
            python3 - "${renovate_log}" << 'PY'
          import json, sys
          for line in open(sys.argv[1], encoding="utf-8"):
              line = line.strip()
              if not line:
                  continue
              if "packageFiles with updates" in line:
                  print("packageFiles with updates: " + line[:2000])
                  continue
              try:
                  obj = json.loads(line)
              except json.JSONDecodeError:
                  print(line[:500])
                  continue
              msg = obj.get("msg") or obj.get("message")
              if msg:
                  print(f"{obj.get('level', '')}: {msg}"[:500])
          PY
          else
            echo "Renovate log was not found."
          fi
          echo "::endgroup::"

          if [ "$status" -ne 0 ]; then
            echo "pin-transitives exited ${status}"
            exit "$status"
          fi

          version=$(sed -n '/<dependencyManagement>/q;s/.*<version>\([^<]*\)<\/version>.*/\1/p' lightwell-pins.xml)
          version=${version//[[:space:]]/}
          test -n "$version"
          echo "Pin BOM version: ${version}"
          sed -i -E "/<artifactId>rhlw-pins<\/artifactId>/,/<\/dependency>/ s|<version>[^<]*</version>|<version>${version}</version>|" pom.xml

          echo "::group::lightwell-pins.xml"
          cat lightwell-pins.xml
          echo "::endgroup::"
          echo "::group::Changes"
          git diff -- lightwell-pins.xml pom.xml
          echo "::endgroup::"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Pin Lightwell rebuilds of transitive dependencies"
          title: "Pin Lightwell rebuilds of transitive dependencies"
          body: |
            Updates `lightwell-pins.xml` with Lightwell `rhlw` rebuilds and sets the `rhlw-pins` import in `pom.xml` to that BOM version.

            Generated with `scripts/pin-transitives.mjs` from `lightwell-experience/renovate-config`.
            The import applies to transitive dependencies. Spring Framework (`spring-core`, `spring-webmvc`, `spring-expression`) is the set published in the public Lightwell demo repository.
            Direct dependencies keep the version declared in `pom.xml`.
          branch: lightwell/transitive-pins
          add-paths: |
            lightwell-pins.xml
            pom.xml
